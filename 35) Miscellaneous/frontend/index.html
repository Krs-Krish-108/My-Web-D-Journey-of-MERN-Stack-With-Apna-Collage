<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET & POST</title>
</head>
<body>
    <h1>Get request Form</h1>
    <form method="get" action="http://localhost:8080/register">
        <input placeholder="Enter username" type="text" name="user">
        <input placeholder="Enter password" type="password" name="password">
        <input type="submit">
    </form>
    <h1>Post request Form</h1>
    <form method="post" action="http://localhost:8080/register">
        <input placeholder="Enter username" type="text" name="user">
        <input placeholder="Enter password" type="password" name="password">
        <input type="submit">
    </form>=
</body>
</html>
